name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dater_test
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: date_me_maybe_test
        ports:
          - 65500:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://dater_test:ci-local-only@127.0.0.1:65500/date_me_maybe_test
      - run: npm run build
